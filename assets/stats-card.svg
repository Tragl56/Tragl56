<text x="35" y="175.6" font-family="Fira Code, Consolas, monospace" font-size="14.5"><tspan fill="#e06c75">stack</tspan><tspan fill="#abb2bf">     = [</tspan><tspan fill="#98c379">"Python"</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#98c379">"TypeScript"</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#98c379">"Java"</tspan><tspan fill="#abb2bf">,</tspan></text>
